<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1014">
  <title>Opportunity · Marte</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/campaign.css">
  <link rel="stylesheet" href="css/pixel-ui.css">
  <link rel="stylesheet" href="/assets/assistant/nova.css">
  <link rel="stylesheet" href="css/camera.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
</head>
<body>
  <main class="stage" id="stage" aria-label="Exploração de Marte">
    <canvas id="gameCanvas" aria-label="Mapa de Marte. WASD ou setas para mover, E para interagir, M para viajar, Esc para pausar." tabindex="0"></canvas>
    <div class="hint" id="interactionHint" hidden></div>
    <aside class="inspect-card" id="inspectCard" role="dialog" aria-labelledby="inspectTitle" hidden>
      <div class="inspect-card-heading">
        <span class="toolbar-label">PONTO DE INTERESSE</span>
        <button class="icon-button" id="closeInspect" type="button" aria-label="Fechar interação">×</button>
      </div>
      <h2 id="inspectTitle"></h2>
      <p id="inspectDescription"></p>
      <div class="inspect-info" id="inspectInfo"></div>
      <div id="scanControls" hidden>
        <label for="scanRange" class="scan-label">SINTONIA DO ESPECTRÔMETRO <strong id="scanValue">50</strong></label>
        <input id="scanRange" type="range" min="0" max="100" value="50">
        <div class="scan-readout" id="scanHint"></div>
      </div>
      <button id="actionButton" class="action-button" type="button" hidden>INTERAGIR</button>
    </aside>
    <button class="touch-menu icon-button" id="touchMenuButton" type="button" aria-label="Pausar jogo">Ⅱ</button>
    <div class="mobile-controls" aria-label="Controles de movimento">
      <div class="direction-pad">
        <button type="button" data-key="ArrowUp" aria-label="Mover para cima">▲</button>
        <button type="button" data-key="ArrowLeft" aria-label="Mover para a esquerda">◀</button>
        <button type="button" data-key="ArrowDown" aria-label="Mover para baixo">▼</button>
        <button type="button" data-key="ArrowRight" aria-label="Mover para a direita">▶</button>
      </div>
      <button class="touch-action" type="button" data-action="inspect" aria-label="Interagir">E</button>
    </div>
    <section class="paused-overlay" id="pausedOverlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
      <div class="pause-menu">
        <h1 id="pauseTitle">Jogo pausado</h1>
        <button id="pauseButton" class="ui-button" type="button">Continuar</button>
        <button id="atlasButton" class="ui-button" type="button">Viajar para outra região</button>
        <button id="resetButton" class="ui-button" type="button">Reiniciar posição</button>
        <p>WASD / SETAS · MOVER<br>E · INTERAGIR &nbsp; M · VIAJAR &nbsp; ESC · PAUSAR</p>
      </div>
    </section>
    <div class="toast" id="toast" hidden role="status"></div>
  </main>
  <dialog class="mars-camera" id="marsCamera" aria-labelledby="cameraTitle">
    <header><div><strong id="cameraTitle">PANCAM · VISÃO 3D</strong><small id="cameraLocation"></small></div><button id="cameraClose" type="button">Voltar · Esc</button></header>
    <div class="mars-camera-viewport" id="cameraViewport"><span class="camera-reticle" aria-hidden="true">+</span><p id="cameraMessage" role="status">Carregando ambiente 3D…</p></div>
    <footer>
      <p>Arraste ou use as setas para olhar · Role para aproximar</p>
      <div class="camera-tools"><button id="cameraReset" type="button">Centralizar · R</button><label>Zoom <input id="cameraZoom" type="range" min="1" max="4" step="0.1" value="1"></label><button id="cameraCapture" type="button">Fotografar</button></div>
      <a id="cameraPhoto" download="opportunity-marte.png" hidden><img id="cameraPreview" alt="Última fotografia da câmera"><span>Baixar fotografia</span></a>
    </footer>
  </dialog>
  <div class="atlas-backdrop" id="atlasModal" hidden>
    <section class="atlas-dialog" role="dialog" aria-modal="true" aria-labelledby="atlasTitle">
      <header>
        <h2 id="atlasTitle">Viajar por Marte</h2>
        <button class="icon-button" id="closeAtlas" type="button" aria-label="Fechar mapa de regiões">×</button>
      </header>
      <canvas id="atlasCanvas" width="860" height="310" aria-label="Regiões de Marte"></canvas>
      <div id="atlasChoices" class="atlas-choices"></div>
    </section>
  </div>
  <script src="js/config.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/tilemap-data.js"></script>
  <script src="js/ship-data.js"></script>
  <script src="/assets/astronaut/explorer-sprite.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/engine.js"></script>
  <script src="/life/engine.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="/assets/assistant/nova.js"></script>
  <script src="js/campaign-ui.js"></script>
  <script src="js/camera-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
