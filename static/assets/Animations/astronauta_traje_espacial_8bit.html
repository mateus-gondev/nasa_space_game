<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traje Espacial – 8-bit</title>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.dataset.embed='true'</script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--fg:#9dffb0;--btn:#e8ecf4;--btnbg:#2a3350;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'Press Start 2P',monospace}
#stage{position:relative;width:min(100vw,177vh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#hud{position:absolute;left:8cqw;top:9cqw;color:var(--fg);font-size:1.35cqw;line-height:2;text-shadow:0 0 6px rgba(120,255,160,.7);z-index:2}
#hud div{visibility:hidden}#hud div.on{visibility:visible}
#cap{position:absolute;left:0;right:0;bottom:1.2cqw;text-align:center;color:#e8ecf4;font-size:1.35cqw;z-index:2;text-shadow:2px 2px 0 #000}
.bar{display:flex;gap:10px}
button{font:inherit;font-size:10px;color:var(--btn);background:var(--btnbg);border:3px solid var(--btn);padding:10px 12px;cursor:pointer}
button:focus-visible{outline:3px solid #ffb04d;outline-offset:2px}
html[data-embed="true"] body{gap:0;padding:0;background:transparent}
html[data-embed="true"] #stage{width:min(100vw,177.77vh)}
html[data-embed="true"] .bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="192" height="108"></canvas>
  <div id="hud">
    <div data-t="5.8">MACACAO .... OK</div>
    <div data-t="7.0">LUVAS ........ OK</div>
    <div data-t="8.1">BOTAS ........ OK</div>
    <div data-t="9.2">SISTEMAS ..... OK</div>
    <div data-t="10.2">TRAJE PRONTO!</div>
  </div>
  <div id="cap"></div>
</div>
<div class="bar">
  <button id="rep">REINICIAR</button>
  <button id="snd">SOM: OFF</button>
</div>
<script>
const W=192,H=108,c=document.getElementById('c'),x=c.getContext('2d'),cap=document.getElementById('cap');
const embedded=new URLSearchParams(location.search).get('embed')==='1';
const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))};
const disc=(cx,cy,rx,ry,col)=>{for(let j=-Math.round(ry);j<=Math.round(ry);j++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-j*j/(ry*ry))));R(cx-w,cy+j,2*w+1,1,col)}};
const hs=(a,b)=>{const n=Math.sin(a*12.9898+b*78.233)*43758.5453;return n-Math.floor(n)};
const cl=v=>Math.max(0,Math.min(1,v)),e=u=>{u=cl(u);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2};
const LOOP=13;
function room(t){
  for(let i=0;i<9;i++){R(i*24+2,6,20,64,'#262e55');R(i*24+2,6,20,1,'#3c4770');R(i*24+2,6,1,64,'#3c4770')}
  R(0,70,W,38,'#161a33');for(let i=0;i<W;i+=16)R(i,70,1,38,'#232a52');R(0,70,W,2,'#4a5580');
  disc(96,34,26,26,'#3c4770');disc(96,34,24,24,'#8c96b5');
  for(let yy=-22;yy<=22;yy++)for(let xx=-22;xx<=22;xx++){
    if(xx*xx+yy*yy>484)continue;
    const px=96+xx,py=34+yy,ed=Math.hypot(px-102,py-92);let col='#05060f';
    if(ed<52)col=ed>49?'#7fc7ff':(hs(Math.floor(px/3),Math.floor(py/3))>.62?'#3d8a4f':'#2c6fbb');
    else if(hs(px,py)>.985)col=(Math.floor(t*3+px)%2)?'#ffffff':'#8c96b5';
    R(px,py,1,1,col);
  }
  R(72,34,48,1,'#3c4770');const on=Math.floor(t*2)%2;
  R(8,12,3,3,on?'#ff8a3d':'#5a2f1a');R(181,12,3,3,on?'#5a2f1a':'#ff8a3d');
  R(40,84,112,24,'#2f3860');R(40,84,112,3,'#5a6798');R(40,87,112,1,'#1a2040');
}
function person(t){
  const bob=Math.sin(t*2)*.45, cx=96, hy=17+bob;
  const top=34+bob, waist=62+bob;
  const torso=e((t-1.0)/2.0), legs=e((t-2.7)/1.5), arms=e((t-4.0)/1.4), boots=e((t-5.8)/.9), pack=e((t-7.0)/.8);

  // Silhueta humana: cabeça, pescoço, tronco, braços e pernas conectados.
  // O rosto permanece descoberto durante toda a animação (sem capacete).
  R(cx-5,hy-2,10,3,'#2a3350');R(cx-6,hy+1,12,9,'#d9a441');
  R(cx-5,hy+2,10,7,'#e8b85c');R(cx-4,hy+4,2,2,'#1b1f3a');R(cx+2,hy+4,2,2,'#1b1f3a');
  R(cx-2,hy+8,4,1,'#8b4b32');R(cx-3,hy+10,6,3,'#b9772a');
  // Pescoço e roupa base
  R(cx-3,hy+12,6,7,'#b9772a');
  R(cx-5,top,10,27,'#2a3350');R(cx-4,top+2,8,23,'#7a85a6');
  // Braços humanos em posição natural, levemente afastados do tronco
  R(cx-12,top+3,7,24,'#2a3350');R(cx-11,top+5,5,19,'#b9772a');
  R(cx+5,top+3,7,24,'#2a3350');R(cx+6,top+5,5,19,'#b9772a');
  // Pernas e botas-base
  R(cx-6,waist,5,24,'#2a3350');R(cx+1,waist,5,24,'#2a3350');
  R(cx-5,waist+2,3,19,'#7a85a6');R(cx+2,waist+2,3,19,'#7a85a6');
  R(cx-7,waist+22,7,4,'#1b1f3a');R(cx+0,waist+22,7,4,'#1b1f3a');

  // Calças do traje: sobem pelas pernas e se encaixam na cintura.
  if(legs>0){
    const lift=(1-legs)*24;
    R(cx-8,waist-1+lift,7,25,'#2a3350');R(cx-7,waist+lift,5,23,'#e8ecf4');
    R(cx+1,waist-1+lift,7,25,'#2a3350');R(cx+2,waist+lift,5,23,'#e8ecf4');
    R(cx-7,waist+4+lift,5,2,'#aab3c8');R(cx+2,waist+4+lift,5,2,'#aab3c8');
    R(cx-7,waist+13+lift,5,2,'#ff8a3d');R(cx+2,waist+13+lift,5,2,'#ff8a3d');
    R(cx-8,waist-2+lift,16,5,'#c9d0e0');R(cx-7,waist-1+lift,14,3,'#e8ecf4');
  }

  // Peitoral e macacão: a peça sobe pelo tronco e termina junto ao pescoço.
  if(torso>0){
    const rise=(1-torso)*30, y=top+rise;
    R(cx-10,y+2,20,27,'#2a3350');
    R(cx-8,y,16,28,'#aab3c8');R(cx-7,y+1,14,25,'#e8ecf4');
    R(cx-6,y+4,12,17,'#c9d0e0');
    // Gola alta integrada ao macacão: encosta na base do pescoço, sem vão.
    R(cx-5,y-2,10,5,'#2a3350');R(cx-4,y-1,8,4,'#e8ecf4');
    R(cx-3,y-1,6,2,'#aab3c8');
    // Painel frontal, fecho e identificação
    R(cx-4,y+5,8,2,'#ff8a3d');R(cx-3,y+9,6,8,'#7a85a6');
    R(cx-2,y+11,4,3,'#9dffb0');R(cx-6,y+20,12,2,'#8c96b5');
    R(cx-7,y+25,14,3,'#aab3c8');
  }

  // Mangas: acompanham o formato dos braços e conectam ombro, cotovelo e punho.
  if(arms>0){
    const slide=(1-arms)*20;
    R(cx-15,top+2+slide,7,25,'#2a3350');R(cx-14,top+3+slide,5,22,'#e8ecf4');
    R(cx+8,top+2+slide,7,25,'#2a3350');R(cx+9,top+3+slide,5,22,'#e8ecf4');
    R(cx-14,top+12+slide,5,4,'#c9d0e0');R(cx+9,top+12+slide,5,4,'#c9d0e0');
    R(cx-14,top+17+slide,5,3,'#ff8a3d');R(cx+9,top+17+slide,5,3,'#ff8a3d');
    R(cx-15,top+24+slide,7,4,'#aab3c8');R(cx+8,top+24+slide,7,4,'#aab3c8');
  }

  // Botas encaixam nos pés, sem alterar a silhueta humana.
  if(boots>0){
    R(cx-8,waist+20,8,7,'#2a3350');R(cx-7,waist+20,6,5,'#e8ecf4');
    R(cx,waist+20,8,7,'#2a3350');R(cx+1,waist+20,6,5,'#e8ecf4');
    R(cx-7,waist+23,7,2,'#ff8a3d');R(cx+1,waist+23,7,2,'#ff8a3d');
  }

  // Mochila/suporte de oxigênio aparece atrás dos ombros.
  if(pack>0){
    R(cx-13,top+3,4,20,'#2a3350');R(cx-12,top+4,3,18,'#8c96b5');
    R(cx+9,top+3,4,20,'#2a3350');R(cx+10,top+4,3,18,'#8c96b5');
    R(cx-14,top+7,2,10,'#ff8a3d');R(cx+12,top+7,2,10,'#ff8a3d');
  }

  // Acabamentos e indicadores luminosos do traje completo.
  if(t>8){
    R(cx-1,top+3,2,3,'#ff8a3d');R(cx-6,top+18,3,2,'#7fc7ff');R(cx+3,top+18,3,2,'#7fc7ff');
    const blink=Math.floor(t*3)%2;R(cx+10,top+13,2,2,blink?'#9dffb0':'#3d8a4f');
  }
}
function frame(t){
  x.fillStyle='#1a2040';x.fillRect(0,0,W,H);room(t);
  // plataforma iluminada
  R(69,82,54,2,'#5a6798');
  person(t);
  if(t>9.8&&t<10.05){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,W,H)}
}
const caps=[[0,'PREPARANDO O TRAJE'],[1.0,'VESTINDO O MACACAO...'],[2.7,'AJUSTANDO AS PERNAS'],[4.0,'VESTINDO AS MANGAS'],[5.8,'CALCANDO AS BOTAS'],[7.0,'ACOPLANDO EQUIPAMENTO'],[9.2,'VERIFICANDO SISTEMAS'],[10.2,'TRAJE PRONTO!']];
let ctx=null,sound=false,fired={},t0=performance.now();
const beeps=[[1.2,330,.1],[3.0,440,.1],[4.2,330,.1],[6.0,220,.1],[7.2,660,.1],[9.2,880,.08],[10.2,1320,.2]];
function beep(f,d){if(!sound||!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function loop(now){
  const elapsed=(now-t0)/1000;
  let t=embedded?Math.min(elapsed,LOOP):elapsed%LOOP;t=Math.floor(t*15)/15;if(!embedded&&t<.1)fired={};
  frame(t);document.querySelectorAll('#hud div').forEach(d=>d.classList.toggle('on',t>=+d.dataset.t));
  let ct='';for(const k of caps)if(t>=k[0])ct=k[1];cap.textContent=ct;
  beeps.forEach((b,i)=>{if(t>=b[0]&&!fired[i]){fired[i]=1;beep(b[1],b[2])}});
  if(embedded&&elapsed>=LOOP){window.parent.postMessage('suit-animation-complete',location.origin);return}
  requestAnimationFrame(loop);
}
document.getElementById('rep').onclick=()=>{t0=performance.now();fired={}};
document.getElementById('snd').onclick=function(){sound=!sound;this.textContent='SOM: '+(sound?'ON':'OFF');if(sound&&!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)()};
requestAnimationFrame(loop);
</script>
</body>
</html>
