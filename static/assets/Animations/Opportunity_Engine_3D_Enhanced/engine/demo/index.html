<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Opportunity · Lab Environment Engine</title>
  <style>
    :root{color-scheme:dark;--fg:#dbe9ed;--muted:#8da9b2;--accent:#69d5e8}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#070c13;color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}
    #view{position:fixed;inset:0;touch-action:none}#view canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,2.2vw,32px)}
    .top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.brand{background:#09121cbd;border:1px solid #29404d;padding:12px 15px;border-radius:9px;backdrop-filter:blur(10px)}.tag{font:700 10px/1.3 monospace;letter-spacing:.19em;color:#85c8cf}
    .brand h1{font-size:17px;font-weight:650;margin:5px 0 0}.brand p{font-size:11px;color:#8fa8b3;margin:5px 0 0}
    .controls{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:end}
    button,select{font:600 12px inherit;background:#142331;color:#dcecf2;border:1px solid #3c606e;border-radius:7px;padding:9px 11px;cursor:pointer}
    select{font:600 12px system-ui;appearance:auto}button:hover{background:#235066}
    .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px}
    .cross::before,.cross::after{content:'';position:absolute;background:#c9edf1b8}.cross::before{left:13px;top:2px;width:2px;height:24px}.cross::after{top:13px;left:2px;width:24px;height:2px}
    .footer{display:flex;gap:12px;align-items:end;justify-content:space-between}.readout{background:#08121bcf;border:1px solid #26414b;border-radius:10px;padding:11px 14px;max-width:450px;backdrop-filter:blur(10px)}
    .readout strong{font-size:13px;display:block}.readout span{color:var(--muted);font-size:12px;line-height:1.55}.stat{font:700 11px/1.7 monospace;letter-spacing:.08em;color:#8fbbc4;text-align:right}
    #error{position:fixed;inset:auto 15px 15px;max-width:680px;background:#301822;padding:17px;color:#ffb1bc;border-radius:8px;display:none;z-index:9}
    @media(max-width:650px){.top{flex-direction:column}.controls{justify-content:start}.brand h1{font-size:14px}.readout{max-width:72%}.stat{font-size:10px}}
  </style>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
</head>
<body>
  <main id="view" aria-label="Visualização 3D do laboratório"></main>
  <div class="hud">
    <div class="top">
      <div class="brand"><span class="tag">MER-B / LAB TRAINING</span><h1>Laboratório — Renderização aprimorada</h1><p>Geometria procedural · Materiais PBR · Sombras · Sem GLB</p></div>
      <div class="controls"><label for="quality" style="font-size:12px;color:#aac1c9">Qualidade</label><select id="quality"><option value="low">Baixa</option><option value="balanced" selected>Equilibrada</option><option value="high">Alta</option></select><button id="reset">Centralizar câmera</button></div>
    </div>
    <div class="cross" aria-hidden="true"></div>
    <div class="footer">
      <div class="readout"><strong id="targetName">Câmera científica</strong><span>Arraste para olhar ao redor · Scroll para zoom · R para centralizar. A cena utiliza um mapa fictício de demonstração.</span></div>
      <div class="stat" id="stats">CAM POV<br/>FOV 70°<br/>-- FPS</div>
    </div>
  </div>
  <div id="error"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
